<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickify - WatchList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="./assests/favicon.ico">
    <link rel="stylesheet" href="./css/header-footer.css">
    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
    <header>
        <div class="my-container">
            <div class="logo">
                <a href="/"><img src="./assests/Logopic.png" alt="Pickify Logo"></a>
                <span class="website-name">Pickify</span>
            </div>
            <nav>
                <ul>
                </ul>
            </nav>
            <div class="auth-buttons">
                <a href="#" id="header-username" class="username">Username</a>
                <a href="landingpage.html" class="logout">Logout</a>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">Admin Panel</h1>
            </div>

            <nav class="nav-links">
                <a href="#user-section" class="admin-nav-link active">
                    <span class="icon"><i class="fas fa-users"></i></span> Users
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="content-inner">
                <div class="welcome-card">
                    <div class="total-users">
                        <span class="icon"><i class="fas fa-users"></i></span>
                        <div>
                            <p class="total-users-title">Total Users</p>
                            <p class="total-users-number">3</p>
                        </div>
                    </div>
                </div>

                <div class="user-list-container">
                    <div class="user-list-header">
                        <h3>User List</h3>
                    </div>

                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>001</td>
                                <td>JohnDoe</td>
                                <td>john.doe@example.com</td>
                                <td class="status-active">Active</td>
                                <td><button class="action-btn deactivate-btn">Deactivate</button></td>
                            </tr>
                            <tr>
                                <td>002</td>
                                <td>JaneSmith</td>
                                <td>jane.smith@example.com</td>
                                <td class="status-inactive">Inactive</td>
                                <td><button class="action-btn activate-btn">Activate</button></td>
                            </tr>
                            <tr>
                                <td>003</td>
                                <td>AliceWonder</td>
                                <td>alice.wonder@example.com</td>
                                <td class="status-active">Active</td>
                                <td><button class="action-btn deactivate-btn">Deactivate</button></td>
                            </tr>
                            </tbody>
                    </table>
                </div>

            </div>
        </main>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const usernameEl = document.getElementById('header-username');

            // Function to update username display and prevent clicks
            function updateUsernameDisplay() {
                const userData = localStorage.getItem('loggedInUser') || sessionStorage.getItem('loggedInUser');

                if (usernameEl) {
                    if (userData) {
                        const user = JSON.parse(userData);
                        usernameEl.textContent = user.name || user.nmail || "Profile";
                        usernameEl.removeAttribute('href');
                        usernameEl.style.cursor = 'default';
                    } else {
                        usernameEl.textContent = "Login";
                        usernameEl.href = "signin.html"; 
                        usernameEl.style.cursor = 'pointer';
                    }
                }
            }

            updateUsernameDisplay();

            if (usernameEl) {
                usernameEl.addEventListener('click', function(e) {
                    const userData = localStorage.getItem('loggedInUser') || sessionStorage.getItem('loggedInUser');
                    if (userData) {
                        e.preventDefault();
                    }
                });
            }

            // ✅ Logout functionality
            const logoutBtn = document.querySelector('.logout');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    fetch('http://localhost:3000/logout')
                        .then(() => {
                            sessionStorage.removeItem('loggedInUser');
                            localStorage.removeItem('loggedInUser');
                            window.location.href = 'landingpage.html'; // Redirect after logout
                        })
                        .catch(error => console.error('Error during logout:', error));
                });
            }

            // Interval to re-check login status and update display
            setInterval(() => {
                updateUsernameDisplay(); // Call the function to handle updates
                
                // Re-ensure logout button's click handler is active
                const logoutBtnInterval = document.querySelector('.logout');
                if (logoutBtnInterval) {
                    logoutBtnInterval.onclick = function (e) { // Using .onclick to replace previous handlers
                        e.preventDefault();
                        fetch('http://localhost:3000/logout')
                            .then(() => {
                                sessionStorage.removeItem('loggedInUser');
                                localStorage.removeItem('loggedInUser');
                                window.location.href = 'landingpage.html';
                            })
                            .catch(error => console.error('Error during logout:', error));
                    };
                }
            }, 1000); // Updates every second
        });
    </script>
    <script src="./js/admin.js"></script>
</body>
</html>
