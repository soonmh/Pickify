<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Reviews</title>
        <link rel="icon" href="./assests/favicon.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./css/header-footer.css">
        <link rel="stylesheet" href="./css/reviews.css">
        <script src="./js/edit.js" defer></script>  
        <script src="./js/comment.js" defer></script>
        <script src="./js/delete.js" defer></script>
        <script src="./js/rating.js" defer></script>
        <script src="./js/review.js" defer></script>
    </head>

    <body data-page-type="main">
        <div id="header-placeholder"></div>

        <div class="summary-container">
            <div class="item-summary">
                <img class="item-poster" src="" alt="Item Poster">
                <div class="item-details">
                    <h2 class="item-title"></h2>
                    <div class="item-meta">
                        <span class="item-type"></span>
                        <span class="item-year"></span>
                        <span class="item-genre"></span>
                    </div>
                    <div class="item-specifics">
                        <p class="item-author" style="display: none;"></p>
                        <p class="item-director" style="display: none;"></p>
                        <p class="item-artist" style="display: none;"></p>
                        <p class="item-duration" style="display: none;"></p>
                    </div>
                    <p class="item-description"></p>
                </div>
            </div>

            <div class="review-summary">
            
                <span class="vote-average"></span>
                <div class="breakdown">
                    <p>5 stars: <span class="rating-5">0%</span> | 4 stars: <span class="rating-4">0%</span> | 3 stars: <span class="rating-3">0%</span> | 2 stars: <span class="rating-2">0%</span> | 1 stars: <span class="rating-1">0%</span></p>
                </div>
            </div>
        </div>

        <div class="review-list">
        </div>

        <div class="review-form">
            <h3>Write a Review</h3>
            <div class="rating-input">
                <label for="rating">Your Rating:</label>
                <div class="star-rating-bar" id="star-rating-bar">
                    <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="5 stars">&#9733;</label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 stars">&#9733;</label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 stars">&#9733;</label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 stars">&#9733;</label>
                    <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 star">&#9733;</label>
                </div>
            </div>
            <textarea id="review-text" placeholder="Write your review here..."></textarea>
            <button id="submit-review">Submit Review</button>
        </div>

        <div id="footer-placeholder"></div>
        <script src="./js/header-footer.js"></script>  
    </body>
</html>
